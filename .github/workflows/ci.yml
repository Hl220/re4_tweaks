name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        build-type: [Debug, Release]
    name: Build ${{ matrix.build-type }}
    runs-on: windows-2025-vs2026

    steps:
      - name: Set variables for artifact names
        id: vars
        shell: bash
        run: |
          echo "type=${{ matrix.build-type }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d_%H%M%S')" >> $GITHUB_OUTPUT
          GIT_REF=${{ github.head_ref || github.ref_name }}
          # Replace illegal file system characters in branch name
          echo "git_ref=${GIT_REF//[\":<>|*?\/\\]/_}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Remove VERBOSE
        shell: bash
        if: matrix.build-type == 'Release'
        run: |
          sed -i "s/#define VERBOSE//" dllmain/dllmain.h

      - name: Build ${{ matrix.build-type }}
        run: |
          msbuild re4_tweaks.sln /p:Configuration=${{ matrix.build-type }} /p:PostBuildEventUseInBuild=false

      - name: Create default configuration file
        shell: bash
        working-directory: ./${{ matrix.build-type }}
        run: |
          mkdir re4_tweaks
          cp ../settings/settings.ini ./dinput8.ini
          cp ../settings/trainer_settings.ini ./re4_tweaks/trainer.ini

      - name: Copy game data files
        shell: bash
        working-directory: ./${{ matrix.build-type }}
        run: |
          cp -r ../external/EnglishSubtitleData/Bin32/re4_tweaks/ ./
          cp -r ../dist/Bin32/re4_tweaks/ ./

      - name: Upload ${{ matrix.build-type }}
        uses: actions/upload-artifact@v7
        with:
          path: |
            ${{ matrix.build-type }}/re4_tweaks/
            ${{ matrix.build-type }}/dinput8.dll
            ${{ matrix.build-type }}/dinput8.ini
            ${{ matrix.build-type }}/dinput8.pdb
          name: re4_tweaks_${{ steps.vars.outputs.type }}_${{ steps.vars.outputs.git_ref }}_${{ steps.vars.outputs.date }}
      
      - name: Create Release
        if: matrix.build-type == 'Release' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_ID="${GITHUB_SHA::7}"
          RELEASE_DATE="${{ steps.vars.outputs.date }}"
          TAG_NAME="2.0-beta-${COMMIT_ID}"
          ARCHIVE_NAME="re4_tweaks.2.0-beta-${COMMIT_ID}.zip"
          
          # Package required release files into zip
          cd Release
          7z a "../${ARCHIVE_NAME}" re4_tweaks dinput8.dll dinput8.ini
          cd ..

          PR_URL="${{ github.event.pull_request.html_url }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          LINK="${PR_URL:-$COMMIT_URL}"

          gh release create "$TAG_NAME" "$ARCHIVE_NAME" \
            --title "re4_tweaks 2.0 beta ${RELEASE_DATE}" \
            --notes "Latest changes: $LINK" \
            --prerelease
